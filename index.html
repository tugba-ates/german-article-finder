<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>German Article Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: #f1f5f9;
    }
    h1 { font-size: 2.2rem; margin-bottom: 8px; text-align: center; }
    .subtitle { color: #94a3b8; margin-bottom: 32px; text-align: center; }
    
    .loading-bar {
      color: #fbbf24;
      font-weight: 600;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: rgba(251, 191, 36, 0.1);
      border-radius: 8px;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .search-box { display: flex; gap: 8px; width: 100%; max-width: 450px; }
    input { flex: 1; padding: 16px 20px; font-size: 1.1rem; border: none; border-radius: 12px; outline: none; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    input:disabled { background: #e2e8f0; cursor: not-allowed; }
    button { padding: 16px 24px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 12px; background: #6366f1; color: #fff; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    button:hover { background: #4f46e5; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }

    .result { margin-top: 40px; padding: 40px; border-radius: 20px; text-align: center; display: none; width: 100%; max-width: 450px; box-shadow: 0 10px 15px rgba(0,0,0,0.2); transition: all 0.3s ease; }
    .result.der { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .result.die { background: linear-gradient(135deg, #db2777, #be185d); }
    .result.das { background: linear-gradient(135deg, #16a34a, #15803d); }
    .result.prediction { border: 2px dashed #cbd5e1; background: rgba(255,255,255,0.05); box-shadow: none; }
    
    .result .word { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }
    .result .meaning { font-size: 1.1rem; margin-top: 16px; opacity: 0.9; }
    
    /* English Meaning CSS Class */
    .result .meaning-en { font-size: 1.1rem; margin-top: 6px; color: #fbbf24; font-weight: 500; font-style: italic; }
    
    .meta { margin-top: 24px; color: #e2e8f0; font-size: 1rem; line-height: 1.8; text-align: center; }
    
    /* Case table (Nominativ / Akkusativ / Dativ) */
    .cases { margin-top: 24px; width: 100%; border-collapse: collapse; font-size: 0.95rem; text-align: left; background: rgba(0,0,0,0.15); border-radius: 12px; overflow: hidden; }
    .cases th, .cases td { padding: 8px 10px; }
    .cases thead th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.75; font-weight: 600; }
    .cases tbody th { font-weight: 600; opacity: 0.85; white-space: nowrap; }
    .cases tbody tr { border-top: 1px solid rgba(255,255,255,0.12); }
    .cases td { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
    .result .word { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
    .cases .art { font-weight: 700; color: #fde68a; }
    .cases-note { margin-top: 8px; font-size: 0.8rem; opacity: 0.7; }
    @media (max-width: 480px) { .result { padding: 28px 16px; } .result .word { font-size: 2.3rem; } .cases { font-size: 0.85rem; } .cases th, .cases td { padding: 6px; } .cases .indef { display: none; } .cases .art { display: block; } }

    .not-found { margin-top: 40px; color: #fca5a5; text-align: center; font-size: 1.1rem; padding: 20px; background: rgba(248, 113, 113, 0.1); border-radius: 12px; display: none;}

    .legend { margin-top: auto; padding-top: 60px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .legend span { padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; letter-spacing: 0.5px;}
    .legend .der { background: #2563eb; }
    .legend .die { background: #db2777; }
    .legend .das { background: #16a34a; }
  </style>
</head>
<body>

  <h1>🇩🇪 German Article Finder</h1>
  <p class="subtitle">Instant Results with Wiktionary & Live Translation</p>

  <div id="loadingStatus" class="loading-bar">Loading massive database, please wait...</div>

  <div class="search-box">
    <input type="text" id="wordInput" placeholder="Enter a word..." autocomplete="off" disabled />
    <button id="searchBtn" onclick="search()" disabled>Search</button>
  </div>

  <div class="result" id="result">
    <div class="word" id="wordDisplay" lang="de"></div>
    <div class="meaning" id="meaningDisplay"></div>
    <div class="meaning-en" id="meaningEnDisplay"></div>
    <div class="meta" id="meta"></div>
    <div id="casesDisplay" lang="de"></div>
  </div>
  
  <div class="not-found" id="notFound"></div>

  <div class="legend">
    <span class="der">DER (Masculine)</span>
    <span class="die">DIE (Feminine)</span>
    <span class="das">DAS (Neuter)</span>
  </div>

  <script>
    let dictionary = {};
    let translationRequestId = 0;
    const loadingStatus = document.getElementById('loadingStatus');
    const input = document.getElementById('wordInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultDiv = document.getElementById('result');
    const wordDisp = document.getElementById('wordDisplay');
    const meanDisp = document.getElementById('meaningDisplay');
    const meanEnDisp = document.getElementById('meaningEnDisplay'); 
    const metaDisp = document.getElementById('meta');
    const notFound = document.getElementById('notFound');

    fetch('words.json')
      .then(res => res.json())
      .then(data => { 
        dictionary = data; 
        const wordCount = Object.keys(data).length;
        loadingStatus.style.display = 'none';
        input.disabled = false;
        searchBtn.disabled = false;
        input.placeholder = `Search within ${wordCount.toLocaleString('en-US')} words...`;
        input.focus();
      })
      .catch(err => {
        loadingStatus.innerHTML = "⚠️ words.json file not found!";
      });

    input.addEventListener('keyup', e => { if (e.key === 'Enter') search(); });

    function predictArtikel(w) {
      const word = w.toLowerCase();
      if (word.endsWith('ung') || word.endsWith('heit') || word.endsWith('keit') || word.endsWith('schaft') || word.endsWith('ei') || word.endsWith('in') || word.endsWith('ion') || word.endsWith('tät') || word.endsWith('ik')) return 'die';
      if (word.endsWith('ismus') || word.endsWith('er') || word.endsWith('ant') || word.endsWith('ent') || word.endsWith('ling') || word.endsWith('or')) return 'der';
      if (word.endsWith('chen') || word.endsWith('lein') || word.endsWith('ment') || word.endsWith('um') || word.endsWith('ma')) return 'das';
      return null;
    }

    function search() {
      const raw = input.value.trim();
      if (!raw) return;
      
      const key = raw.toLowerCase();

      resultDiv.style.display = 'none';
      resultDiv.className = 'result';
      metaDisp.innerHTML = '';
      meanEnDisp.textContent = ''; 
      notFound.style.display = 'none';

      const entry = dictionary[key];
      const prediction = predictArtikel(key);

      if (entry) {
        showResult(entry.artikel, raw, entry.meaning, entry.plural, false);
      } else if (prediction) {
        showResult(prediction, raw, "", "Unknown", true);
      } else {
        notFound.textContent = `"${raw}" was not found in the database and could not be predicted.`;
        notFound.style.display = 'block';
      }
    }

    function showResult(artikel, raw, meaning, plural, isPredicted) {
      resultDiv.classList.add(isPredicted ? 'prediction' : artikel);
      resultDiv.style.display = 'block';
      wordDisp.textContent = `${artikel} ${capitalize(raw)}`;
      
      // The database only stores Wiktionary's FIRST sense, which is often a rare/archaic one
      // (e.g. Anzug -> "das Heranziehen" instead of "suit"). Some entries are junk like "Plural „Bänder“:".
      // So we translate the WORD ITSELF to get its common meanings, and show the gloss only as a secondary hint.
      const cleanMeaning = (meaning && !/^plural\b/i.test(meaning.trim()) && !meaning.trim().endsWith(':')) ? meaning : "";
      meanDisp.textContent = cleanMeaning ? `🇩🇪 ${cleanMeaning}` : "";

      const requestId = ++translationRequestId;
      meanEnDisp.textContent = "🇬🇧 Translating...";

      // dt=t -> main translation, dt=bd -> dictionary alternatives (all common meanings)
      const phrase = `${artikel} ${capitalize(raw)}`;
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl=en&dt=t&dt=bd&q=${encodeURIComponent(phrase)}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (requestId !== translationRequestId) return; // a newer search started meanwhile

          const main = (data[0] || []).map(seg => seg[0]).join('').replace(/^the\s+/i, '').trim();

          // Collect noun alternatives from the dictionary block (fall back to any part of speech)
          let alternatives = [];
          if (Array.isArray(data[1])) {
            const nounBlock = data[1].find(b => b[0] === 'noun') || data[1][0];
            if (nounBlock && Array.isArray(nounBlock[1])) alternatives = nounBlock[1];
          }

          const all = [main, ...alternatives]
            .map(s => (s || '').trim())
            .filter((s, i, arr) => s && arr.findIndex(x => x.toLowerCase() === s.toLowerCase()) === i)
            .slice(0, 5);

          meanEnDisp.textContent = all.length ? `🇬🇧 ${all.join(', ')}` : "";
        })
        .catch(err => {
          if (requestId !== translationRequestId) return;
          console.error("Translation Error:", err);
          meanEnDisp.textContent = "🇬🇧 (Translation failed)";
        });
      
      let infoText = isPredicted 
        ? "⚠️ Word not in database, predicted by suffix." 
        : "✅ Wiktionary record found.";
        
      metaDisp.innerHTML = `
        <div style="margin-bottom: 8px; font-size: 0.9rem; opacity: 0.8;">${infoText}</div>
        <strong>Gender:</strong> ${genderName(artikel)} <br/>
        <strong>Plural Form:</strong> ${plural || '-'}
      `;

      document.getElementById('casesDisplay').innerHTML = buildCaseTable(artikel, capitalize(raw), plural, isPredicted);
    }

    // ---- Case table: Nominativ / Akkusativ / Dativ ----
    const ARTICLES = {
      der: { nom: ['der', 'ein'],  akk: ['den', 'einen'], dat: ['dem', 'einem'] },
      die: { nom: ['die', 'eine'], akk: ['die', 'eine'],  dat: ['der', 'einer'] },
      das: { nom: ['das', 'ein'],  akk: ['das', 'ein'],   dat: ['dem', 'einem'] },
    };
    const PLURAL_ARTICLES = { nom: 'die', akk: 'die', dat: 'den' };

    // Masculine nouns of the "n-Deklination" that the ending rules below don't catch (singular Akk/Dat form)
    const N_DECL_SPECIAL = {
      herr: 'Herrn', mensch: 'Menschen', bär: 'Bären', held: 'Helden', nachbar: 'Nachbarn',
      bauer: 'Bauern', prinz: 'Prinzen', fürst: 'Fürsten', graf: 'Grafen', christ: 'Christen', narr: 'Narren',
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Singular noun form in Akkusativ/Dativ. Usually unchanged, except masculine n-Deklination
    // (der Junge -> den Jungen, der Student -> den Studenten). Detected only when the plural is known.
    function singularOblique(artikel, noun, plural) {
      const key = noun.toLowerCase();
      if (artikel === 'das' && key === 'herz') return { akk: 'Herz', dat: 'Herzen' };
      if (artikel !== 'der') return { akk: noun, dat: noun };
      if (N_DECL_SPECIAL[key]) return { akk: N_DECL_SPECIAL[key], dat: N_DECL_SPECIAL[key] };
      if (plural && plural !== '-') {
        const p = plural.toLowerCase();
        const isNDecl =
          (key.endsWith('e') && p === key + 'n') ||
          (/(ent|ant|ist|oge|at|graph|soph|nom)$/.test(key) && p === key + 'en');
        if (isNDecl) return { akk: plural, dat: plural };
      }
      return { akk: noun, dat: noun };
    }

    // Dativ plural adds -n, unless the plural already ends in -n or -s (die Kinder -> den Kindern, die Autos -> den Autos)
    function dativPlural(plural) {
      return /[ns]$/i.test(plural) ? plural : plural + 'n';
    }

    function buildCaseTable(artikel, noun, plural, isPredicted) {
      const a = ARTICLES[artikel];
      if (!a) return '';
      const hasPlural = plural && plural !== '-' && plural !== 'Unknown' && !/[,/]/.test(plural);
      const sg = isPredicted ? { akk: noun, dat: noun } : singularOblique(artikel, noun, plural);
      const forms = { nom: noun, akk: sg.akk, dat: sg.dat };
      const cell = (art, word) => `<span class="art">${art}</span> ${escapeHtml(word)}`;
      const rows = [['nom', 'Nominativ'], ['akk', 'Akkusativ'], ['dat', 'Dativ']].map(([c, label]) => `
        <tr>
          <th>${label}</th>
          <td>${cell(a[c][0], forms[c])}</td>
          <td class="indef">${cell(a[c][1], forms[c])}</td>
          <td>${hasPlural ? cell(PLURAL_ARTICLES[c], c === 'dat' ? dativPlural(plural) : plural) : '–'}</td>
        </tr>`).join('');
      return `
        <table class="cases">
          <thead><tr><th></th><th>Bestimmt</th><th class="indef">Unbestimmt</th><th>Plural</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${isPredicted ? '<div class="cases-note">⚠️ Article was predicted — please double-check this table.</div>' : ''}`;
    }

    function capitalize(s) { 
      return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); 
    }
    
    function genderName(a) { 
      return { der: 'Masculine', die: 'Feminine', das: 'Neuter' }[a]; 
    }
  </script>
</body>
</html>
